<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Portal Meteor — v5.3</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root{ --sand:#d6c69a; --sand2:#8f8664; --red:#ff4a3a; --ink:#e8e2d0; --panel:rgba(12,13,14,.78); --line:rgba(214,198,154,.32); --green:#8fffaa; --amber:#ffbe5a; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Exo 2",Consolas,sans-serif;color:var(--ink);user-select:none}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #ov{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
  html[lang=vi] *{font-family:"Exo 2",Arial,sans-serif !important}
  html[lang=vi] #screen h1,html[lang=vi] #banner b,html[lang=vi] #boot h1{font-weight:700}
  kbd{display:inline-block;min-width:14px;padding:0 5px;border:1px solid var(--sand2);border-bottom-width:2px;border-radius:3px;font:600 11px "Exo 2",sans-serif;color:#fff;background:rgba(255,255,255,.06);text-align:center;line-height:16px}
  #hud{position:fixed;left:12px;top:10px;display:flex;gap:6px;pointer-events:none}
  .hb{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sand);padding:4px 10px 5px;min-width:64px}
  .hb small{display:block;font-size:10px;letter-spacing:.14em;color:var(--sand2)}
  .hb b{display:block;font:400 18px "Russo One","Exo 2",sans-serif;color:var(--ink);line-height:1.15}
  .hb em{display:block;font-style:normal;font-size:11px;color:#b9b19a}
  #obj{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(10,30,16,.86),rgba(10,20,14,.72));border:1px solid rgba(140,255,170,.5);
       padding:5px 18px 6px;text-align:center;display:none;pointer-events:none;min-width:280px;max-width:46vw}
  #obj small{display:block;font-size:10px;letter-spacing:.18em;color:var(--green)}
  #obj b{display:block;font:400 19px "Russo One","Exo 2",sans-serif;color:#eafff0}
  #obj em{display:block;font-style:normal;font-size:12px;color:#a9d8b4}
  #obj i{display:inline-block;margin-top:3px;font-style:normal;font-size:11px;letter-spacing:.1em;padding:1px 8px;border:1px solid rgba(143,255,170,.35);color:#7fb08a}
  #obj i.on{background:rgba(143,255,170,.18);color:#d8ffe2;border-color:var(--green)}
  #obj.tac{background:linear-gradient(180deg,rgba(40,26,8,.88),rgba(28,18,8,.74));border-color:rgba(255,190,90,.6)}
  #obj.tac small{color:var(--amber)} #obj.tac b{color:#fff3df} #obj.tac em{color:#e0c49a}
  #obj.tac i{border-color:rgba(255,190,90,.4);color:#b9925a} #obj.tac i.on{background:rgba(255,190,90,.2);color:#fff0d6;border-color:var(--amber)}
  #obj.done{border-color:var(--green);background:rgba(20,70,30,.88)} #obj.fail{border-color:#888;background:rgba(40,40,40,.8)}
  #help{position:fixed;right:12px;top:52px;font-size:12px;line-height:1.5;pointer-events:none;color:#cfc6ad;text-shadow:0 0 3px #000;opacity:.7;max-width:360px}
  #help b{color:#fff;font-weight:600;margin-right:4px}
  #help.open{background:var(--panel);border:1px solid var(--line);padding:8px 12px;opacity:1}
  #dbg{position:fixed;right:12px;top:10px;font-size:11px;white-space:pre;text-align:right;color:#9a937e;pointer-events:none;text-shadow:0 0 3px #000}
  #cross{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;pointer-events:none;opacity:.85}
  #cross:before,#cross:after{content:"";position:absolute;background:#f2ead2;box-shadow:0 0 2px #000}
  #cross:before{left:8px;top:0;width:2px;height:18px;clip-path:polygon(0 0,100% 0,100% 35%,0 35%,0 65%,100% 65%,100% 100%,0 100%)}
  #cross:after{top:8px;left:0;height:2px;width:18px;clip-path:polygon(0 0,35% 0,35% 100%,0 100%,0 0,65% 0,100% 0,100% 100%,65% 100%)}
  #bars{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:360px}
  .lbl{font-size:11px;letter-spacing:.12em;color:#d8cfb4;text-shadow:0 0 3px #000;width:100%;display:flex;justify-content:space-between}
  .bar{width:100%;height:7px;background:rgba(0,0,0,.55);border:1px solid var(--line)}
  .bar > div{height:100%;width:100%}
  #rankLbl{font-size:11px;letter-spacing:.08em;color:#ffd27a;text-shadow:0 0 3px #000}
  #rankLbl b{font-weight:700}
  #xpBar{height:3px;border-color:rgba(255,210,122,.3)} #xpFill{background:linear-gradient(90deg,#b8862e,#ffd27a)}
  #hpFill{background:linear-gradient(90deg,#9b8f66,var(--sand))}
  #jetFill{background:#b9d8ff}
  #kit{position:fixed;right:14px;bottom:16px;display:none;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
  .weap{background:var(--panel);border:1px solid var(--line);border-right:3px solid var(--sand);padding:4px 12px;text-align:right;min-width:170px}
  .weap small{display:block;font-size:10px;letter-spacing:.14em;color:var(--sand2)}
  .weap b{font:400 30px "Russo One",sans-serif;color:#fff;line-height:1.1}
  .weap b em{font:400 14px "Exo 2";color:#a59d84;font-style:normal}
  .wl span{display:inline-block;width:18px;margin-left:3px;font-size:11px;text-align:center;border:1px solid var(--line);color:#bbb}
  .wl span.cur{background:var(--sand);color:#111} .wl span.na{opacity:.3}
  .slots{display:flex;gap:5px}
  .slot{position:relative;width:62px;height:46px;background:var(--panel);border:1px solid var(--line);overflow:hidden;text-align:center}
  .slot kbd{position:absolute;left:3px;top:3px}
  .slot span{position:absolute;left:0;right:0;bottom:3px;font-size:10px;color:#d8cfb4}
  .slot em{position:absolute;right:4px;top:3px;font-style:normal;font-size:11px;color:#fff}
  .slot i{position:absolute;left:0;bottom:0;height:3px;background:var(--sand)}
  .slot.ok{border-color:rgba(214,198,154,.7)} .slot.cd{opacity:.55} .slot.on{border-color:var(--amber);box-shadow:0 0 10px rgba(255,190,90,.5)}
  .slot.locked{opacity:.4} .slot.locked em{left:0;right:0;top:20px;font-size:9px;color:#ccc}
  #banner{position:fixed;left:50%;top:22%;transform:translateX(-50%);text-align:center;display:none;pointer-events:none;animation:pop .5s ease-out}
  #banner small{display:block;font-size:13px;letter-spacing:.4em;color:#ffd27a}
  #banner b{display:block;font:400 46px "Russo One",sans-serif;color:#fff;text-shadow:0 0 24px rgba(255,190,90,.6)}
  #banner em{display:block;font-style:normal;font-size:16px;color:#ffe9bf;margin-top:4px}
  @keyframes pop{from{transform:translateX(-50%) scale(1.3);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
  #switcher{position:fixed;left:50%;top:34%;transform:translateX(-50%);display:none;flex-direction:column;gap:2px;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:6px 8px;min-width:260px}
  #switcher div{display:flex;gap:8px;align-items:center;padding:2px 6px;font-size:13px;color:#cfc6ad}
  #switcher div i{font-style:normal;color:var(--sand);width:14px}
  #switcher div em{margin-left:auto;font-style:normal;font-size:11px;color:#8f8664}
  #switcher div.cur{background:rgba(214,198,154,.2);color:#fff}
  #switcher p{margin:4px 0 0;font-size:10px;color:#8f8664;text-align:center}
  #hint{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);display:none;gap:10px;align-items:center;background:rgba(10,18,28,.86);border:1px solid rgba(120,190,255,.45);padding:7px 14px;max-width:560px;pointer-events:none;font-size:14px;line-height:1.35;color:#dbe9f7}
  #hint i{font-style:normal;font:400 16px "Russo One";color:#0b1520;background:#9cf;border-radius:50%;width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center}
  #hint kbd{margin-right:3px;border-color:#7ab}
  #sel{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);font-size:13px;white-space:pre;text-align:center;pointer-events:none;text-shadow:0 0 3px #000;color:#e8dcb8}
  #feed{position:fixed;right:12px;bottom:150px;font-size:13px;line-height:1.5;text-align:right;pointer-events:none;text-shadow:0 0 3px #000;max-width:44vw}
  #squadp{position:fixed;left:12px;bottom:200px;display:none;flex-direction:column;gap:3px;pointer-events:none;width:220px}
  #squadp h5{margin:0 0 2px;font:600 10px "Exo 2";letter-spacing:.14em;color:var(--sand2);text-shadow:0 0 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #squadp .sm{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sand2);padding:2px 6px 2px 2px;transition:border-color .2s}
  #squadp .sm.me{border-left-color:#9fdcff} #squadp .sm.talk{border-color:var(--green);box-shadow:0 0 8px rgba(143,255,170,.35)}
  #squadp .sm.low{border-left-color:var(--red)}
  #squadp img{width:30px;height:30px;flex:none;image-rendering:auto}
  #squadp .sm div{flex:1;min-width:0}
  #squadp b{display:block;font:600 12px "Exo 2";color:#eee;white-space:nowrap}
  #squadp small{display:block;font-size:10px;color:#a59d84;height:12px;white-space:nowrap;overflow:hidden}
  #squadp i{display:block;height:3px;background:rgba(0,0,0,.6);margin-top:1px} #squadp i s{display:block;height:100%;background:linear-gradient(90deg,#9b8f66,var(--sand))}
  #squadp .sm.low i s{background:var(--red)}
  #squadp .role{color:var(--sand);font-weight:400}
  #squadp .chat{margin-top:3px} #squadp .chat p{margin:1px 0;font-size:12px;color:#d8ffe2;text-shadow:0 0 3px #000,0 0 2px #000} #squadp .chat b{display:inline;color:var(--green);font-size:12px}
  body.oper #c{background:#000} body.oper.vert #c{left:50%;width:calc(100vh * 9 / 16);transform:translateX(-50%)}
  #tut{position:fixed;left:50%;top:104px;transform:translateX(-50%);display:none;pointer-events:none;width:min(620px,70vw);background:linear-gradient(180deg,rgba(10,22,34,.9),rgba(8,16,26,.82));border:1px solid rgba(120,190,255,.55);padding:8px 16px 9px;text-align:center}
  #tut small{display:block;font-size:10px;letter-spacing:.24em;color:#9cf}
  #tut p{margin:4px 0;font-size:15px;line-height:1.4;color:#e6f2ff} #tut kbd{border-color:#7ab}
  #tut .dots{display:flex;gap:4px;justify-content:center;margin-top:3px} #tut .dots i{width:14px;height:3px;background:rgba(150,200,255,.2)} #tut .dots i.ok{background:#8fffaa} #tut .dots i.cur{background:#9cf}
  #tut em{display:block;font-style:normal;font-size:11px;color:#7a9ab8}
  /* сенсорное управление */
  #touch{position:fixed;inset:0;pointer-events:none;z-index:15;font-family:"Exo 2",sans-serif}
  #touch.hidden{display:none}
  #touch button{pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;background:rgba(12,13,14,.45);border:1.5px solid rgba(214,198,154,.55);color:#f0e8d0;font:700 15px "Exo 2";border-radius:50%;width:48px;height:48px;padding:0}
  #touch button.on{background:rgba(214,198,154,.55);color:#111}
  #touch .tf{position:absolute;right:10px;bottom:12px;display:none;flex-wrap:wrap-reverse;flex-direction:row-reverse;gap:7px;width:250px;justify-content:flex-start;align-items:flex-end}
  #touch.mfps .tf.fps{display:flex} #touch.mrts .tf.rts{display:flex;width:auto;right:212px;bottom:auto;top:92px;flex-direction:row}
  #touch .tf button.big{width:86px;height:86px;font-size:34px;background:rgba(170,40,30,.4);border-color:rgba(255,120,90,.7)}
  #touch .tf button.mid{width:64px;height:64px;font-size:24px}
  #touch .tf button.wide{border-radius:6px;width:auto;padding:0 12px;height:40px;font-size:13px}
  #touch .tt{position:absolute;right:10px;top:52px;display:flex;gap:6px}
  #touch .tt button{border-radius:6px;width:auto;height:34px;padding:0 10px;font-size:12px}
  #touch.mrts .tt{right:244px}
  #tjoy{position:absolute;display:none;width:120px;height:120px;border-radius:50%;border:2px solid rgba(214,198,154,.4);background:rgba(0,0,0,.15)}
  #tjoy i{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(214,198,154,.5)}
  #trot{display:none;position:fixed;inset:0;background:#000;color:#d6c69a;font:400 22px "Russo One";align-items:center;justify-content:center;text-align:center;padding:20px;pointer-events:auto}
  @media (orientation: portrait){ body.touch #trot{display:flex} }
  body.touch #help, body.touch #dbg{display:none !important}
  body.touch #kit .slots{display:none} body.touch #kit{bottom:auto;top:92px;right:10px;opacity:.8}
  body.touch #kit .weap{min-width:0;padding:2px 8px} body.touch #kit .weap b{font-size:18px}
  body.touch #bars{width:240px;bottom:6px} body.touch #squadp{bottom:auto;top:62px;transform:scale(.8);transform-origin:left top}
  body.touch #feed{bottom:108px;top:auto;right:auto;left:50%;transform:translateX(-50%);text-align:center;font-size:11px;max-width:42vw}
  body.touch #feed > *:nth-last-child(n+4){display:none}
  body.touch #bars{width:300px}
  body.touch #hint{bottom:auto;top:96px;font-size:12px}
  body.touch .hb{padding:2px 6px;min-width:44px} body.touch .hb b{font-size:13px} body.touch .hb em{display:none}
  body.touch #obj{top:4px;left:64%;min-width:0;padding:2px 10px} body.touch #obj b{font-size:13px}
  body.touch #tut{top:64px;width:min(520px,60vw)} body.touch #tut p{font-size:12px}
  body.touch #side{width:200px} body.touch #card{left:150px;right:206px}
  #sq{position:fixed;left:50%;top:96px;transform:translateX(-50%);display:none;pointer-events:none;background:linear-gradient(180deg,rgba(46,26,6,.86),rgba(30,18,6,.72));border:1px solid rgba(255,169,77,.55);padding:3px 14px 4px;text-align:center;min-width:220px;max-width:40vw}
  #sq small{display:block;font-size:9px;letter-spacing:.18em;color:#ffa94d} #sq b{display:block;font:600 13px "Exo 2";color:#fff1de} #sq em{display:block;font-style:normal;font-size:11px;color:#d9b48a}
  body.touch #sq{top:44px;left:auto;right:120px;transform:none;max-width:30vw}
  #clicklock{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.35);cursor:pointer;font:400 22px "Russo One",sans-serif;color:#fff}
  #clicklock small{font:14px "Exo 2";color:#ccc;margin-top:6px}
  /* стратегия */
  #side{position:fixed;right:0;top:64px;bottom:0;width:232px;display:none;flex-direction:column;background:linear-gradient(90deg,rgba(10,11,12,.82),rgba(12,13,14,.92));border-left:1px solid var(--line)}
  #side .tabs{display:flex}
  #side .tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:#a59d84;font:600 11px "Exo 2";padding:8px 2px;cursor:pointer}
  #side .tabs button.cur{color:#fff;border-bottom-color:var(--sand)}
  #side .items{flex:1;overflow:auto;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:5px;align-content:start}
  #side .item{position:relative;height:66px;background:rgba(40,38,30,.6);border:1px solid var(--line);color:var(--ink);cursor:pointer;text-align:left;padding:4px 6px;overflow:hidden;font-family:"Exo 2"}
  #side .item:hover{border-color:var(--sand);background:rgba(70,64,44,.7)}
  #side .item i{display:block;font-style:normal;font-size:18px;color:var(--sand)}
  #side .item b{display:block;font-size:11px;font-weight:600;line-height:1.15}
  #side .item .cost{position:absolute;right:5px;top:4px;font-size:11px;color:#ffd27a}
  #side .item .q{position:absolute;right:5px;bottom:6px;font-size:12px;color:#fff;font-weight:700}
  #side .item .bar{position:absolute;left:0;right:0;bottom:0;height:3px;border:none;background:transparent}
  #side .item .bar s{display:block;height:100%;width:0;background:var(--green)}
  #side .item.off{opacity:.42}
  #side .sfoot{display:flex;flex-direction:column;gap:4px;padding:6px}
  #side .sfoot button{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:6px;font:600 12px "Exo 2";cursor:pointer}
  #side .sfoot button:hover{border-color:var(--sand)}
  #card{position:fixed;left:300px;right:246px;bottom:8px;display:none;flex-direction:column;gap:5px;align-items:center;pointer-events:auto}
  #card .ports{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
  #card .port{position:relative;width:96px;background:var(--panel);border:1px solid var(--line);padding:3px 5px 6px;cursor:pointer;font-size:11px;overflow:hidden}
  #card .port i{font-style:normal;color:var(--sand);margin-right:3px}
  #card .port span{display:block;color:#ffd27a;font-size:10px;letter-spacing:1px}
  #card .port em{display:block;font-style:normal;color:#9a937e;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #card .port s{position:absolute;left:0;bottom:0;height:3px}
  #card .abils{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  #card .ab{position:relative;width:78px;height:54px;background:rgba(40,38,30,.75);border:1px solid var(--line);color:var(--ink);cursor:pointer;font-family:"Exo 2";overflow:hidden;padding:2px}
  #card .ab:hover{border-color:var(--sand)}
  #card .ab i{display:block;font-style:normal;font-size:17px;color:var(--sand)}
  #card .ab b{display:block;font-size:10px;font-weight:600;line-height:1.1}
  #card .ab kbd{position:absolute;right:2px;top:2px;font-size:9px;padding:0 3px}
  #card .ab em{position:absolute;left:4px;top:3px;font-style:normal;font-size:11px;color:#fff;z-index:2}
  #card .ab s{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6)}
  #card .ab.cd{opacity:.6} #card .ab.cast{border-color:var(--amber);box-shadow:0 0 8px rgba(255,190,90,.6)}
  #card .binfo{background:var(--panel);border:1px solid var(--line);padding:6px 12px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:4px;align-items:center}
  #card .binfo b{font:400 15px "Russo One"} #card .binfo em{font-style:normal;color:#9a937e}
  #card .queue{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  #card .queue button{position:relative;background:rgba(40,38,30,.75);border:1px solid var(--line);color:var(--ink);font:11px "Exo 2";padding:3px 6px;cursor:pointer;overflow:hidden}
  #card .queue button s{position:absolute;left:0;bottom:0;height:2px;background:var(--green)}
  /* загрузка и меню */
  #boot{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#1a1a16,#030303 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .7s}
  #boot.done{opacity:0;pointer-events:none}
  #boot h1{font:400 64px "Russo One",sans-serif;letter-spacing:.06em;margin:0;color:var(--sand);text-shadow:0 0 30px rgba(214,198,154,.35)}
  #boot .t{font-size:12px;letter-spacing:.5em;color:var(--sand2);text-transform:uppercase;margin:6px 0 30px}
  #boot .pb{width:min(520px,80vw);height:6px;border:1px solid var(--line);background:rgba(0,0,0,.6)}
  #bootBar{height:100%;width:0;background:linear-gradient(90deg,var(--sand2),var(--sand));transition:width .25s;box-shadow:0 0 12px rgba(214,198,154,.5)}
  #bootTxt{margin-top:10px;font-size:13px;color:#cfc6ad;min-height:18px}
  #bootTip{margin-top:24px;font-size:13px;color:#8f8664;max-width:520px;text-align:center;min-height:36px}
  #screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;gap:40px;background:radial-gradient(ellipse at 30% 50%,rgba(0,0,0,.35),rgba(0,0,0,.82));z-index:20}
  #screen .mcol{display:flex;flex-direction:column;gap:8px;min-width:320px;max-width:440px}
  #screen .mcol.wide{max-width:min(1100px,94vw);width:min(1100px,94vw);max-height:92vh;overflow:auto}
  #screen .mcol.side{background:rgba(12,13,14,.7);border:1px solid var(--line);padding:14px 18px;font-size:13px;color:#cfc6ad}
  #screen h1{font:400 58px "Russo One",sans-serif;letter-spacing:.05em;margin:0;color:var(--sand);text-shadow:0 0 30px rgba(214,198,154,.35)}
  #screen h2{font:400 32px "Russo One",sans-serif;margin:0 0 6px;color:var(--sand)}
  #screen h3{font:400 15px "Russo One";margin:8px 0 2px;color:var(--sand)}
  #screen h4{font:600 12px "Exo 2";letter-spacing:.2em;text-transform:uppercase;color:var(--sand2);margin:14px 0 6px}
  #screen p{margin:2px 0} #screen .sub{color:#b9b19a;margin-bottom:12px}
  #screen ul{margin:4px 0;padding-left:18px} #screen li{margin:3px 0}
  #screen button{background:rgba(214,198,154,.08);border:1px solid var(--line);color:var(--ink);font:600 15px "Exo 2";padding:9px 16px;cursor:pointer;text-align:left}
  #screen button:hover{background:rgba(214,198,154,.2);border-color:var(--sand)}
  #screen button.big{font:400 20px "Russo One";padding:12px 18px;border-color:var(--sand);color:#fff}
  #screen button.lang{font-size:13px;color:#cfc6ad}
  #screen .diffrow{display:flex;gap:4px} #screen .diffrow button{flex:1;font-size:12px;padding:6px;text-align:center}
  #screen button.cur{background:var(--sand);color:#111;border-color:var(--sand)}
  #screen .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  #screen .row{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:13px}
  #screen .row label{flex:1;color:#cfc6ad}
  #screen .row input[type=range]{width:150px;accent-color:#d6c69a}
  #screen .row .val{width:38px;text-align:right;color:#fff;font-size:12px}
  #screen .tog,#screen .chs button{font-size:12px;padding:4px 10px;text-align:center}
  #screen .tog.on{background:rgba(143,255,170,.2);border-color:var(--green);color:#dfffe7}
  #screen .chs{display:flex;gap:3px}
  #screen .binds{display:grid;grid-template-columns:1fr;gap:3px}
  #screen .brow{display:flex;align-items:center;font-size:13px} #screen .brow label{flex:1;color:#cfc6ad}
  #screen .kb{min-width:90px;text-align:center;font-size:13px;padding:4px 8px}
  #screen .kb.wait{border-color:var(--amber);color:var(--amber);animation:blink .8s infinite}
  @keyframes blink{50%{opacity:.4}}
  #screen .note{font-size:12px;color:#9a937e;line-height:1.5} #screen .note b{color:#ddd}
  #screen .kbd{display:flex;flex-direction:column;gap:3px}
  #screen .krow{display:flex;gap:3px}
  #screen .key{width:34px;height:34px;border:1px solid rgba(214,198,154,.2);background:rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#777;overflow:hidden}
  #screen .key small{font-size:7px;color:#9a937e;white-space:nowrap;max-width:32px;overflow:hidden}
  #screen .key.bound{color:#e8dcb8;border-color:rgba(214,198,154,.5)}
  #screen .key.space{width:150px}
  #screen .key.down{background:var(--sand);color:#111;transform:translateY(1px)}
  #screen .key.down small{color:#333}
  #screen .mouse{display:flex;gap:6px;margin-top:10px;align-items:center}
  #screen .mb{width:54px;height:30px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:#aaa}
  #screen .mb.down{background:var(--sand);color:#111}
  #screen .mmove{position:relative;width:46px;height:46px;border:1px solid var(--line);border-radius:50%}
  #screen .mmove i{position:absolute;left:20px;top:20px;width:6px;height:6px;border-radius:50%;background:var(--sand);transition:transform .08s}
  #screen .stats{background:rgba(12,13,14,.7);border:1px solid var(--line);padding:10px 14px;margin:6px 0 10px;font-size:14px}
</style>
</head>
